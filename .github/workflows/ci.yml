name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff linting
        run: scripts/verify lint

      - name: Check Ruff formatting
        run: scripts/verify format

      - name: Run mypy
        run: scripts/verify types

      - name: Verify static OpenAPI document
        run: scripts/verify openapi

      - name: Run tests with coverage
        run: scripts/verify unit

  lint-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Lint GitHub Actions workflows
        run: scripts/verify workflows

      - name: Lint the Dockerfile
        run: scripts/verify dockerfile

      - name: Lint YAML files
        run: scripts/verify yaml

      - name: Lint and check formatting of shell scripts
        run: scripts/verify shell

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Resolve Playwright version
        id: playwright-version
        run: >-
          echo "version=$(uv run python -c
          'import importlib.metadata as m; print(m.version("playwright"))')"
          >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: scripts/verify e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker smoke test
        run: ./scripts/docker-smoke
