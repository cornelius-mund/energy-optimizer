[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-optimizer"
version = "0.1.0"
description = "HTTP service for optimizing household energy usage"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.14,<3.0",
    # Windows ships no IANA time-zone database, which zoneinfo needs for the dashboard zone.
    "tzdata; sys_platform == 'win32'",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.54,<1.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.170,<7.0",
    "mypy>=2.4,<3.0",
    "pyyaml>=6.0,<7.0",
    "pytest>=9.2,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-playwright>=0.10,<1.0",
    "ruff>=0.17,<1.0",
    "types-PyYAML>=6.0,<7.0",
    # File linters run by scripts/verify, all pinned to exact versions. Except
    # for yamllint, which is pure Python, each package provides the upstream
    # release binary and verifies its SHA-256 against a table shipped in the
    # package. The first three version components are the upstream tool version.
    "actionlint-py==1.7.12.25",
    "hadolint-py==2.15.1.3",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "yamllint==1.38.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end tests requiring Playwright browsers",
]
