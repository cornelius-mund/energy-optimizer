# Copy this file to config.yaml and adjust values for the deployment.
time_resolution_minutes: 60

# Fractions of maximum power: [0, 1] is on/off. Continuous control omits levels.
appliances:
  heat_pump:
    name: Heat pump
    included_in_household_load: true
    maximum_power_kw: 3
    control: discrete
    power_levels: [0, 0.3, 0.6, 1]
    history:
      terms:
        - operation: add
          entities:
            - entity_id: sensor.heat_pump_energy
              state_class: total_increasing
              unit: kWh

# IANA time zone in which the dashboard shows and accepts times. Data, API
# timestamps, and stored records always stay in UTC. Use the exact, case-sensitive
# name; the default is UTC. Only zones whose UTC offset is a whole number of hours
# all year are supported, for example Europe/Berlin or America/New_York. Zones
# such as Asia/Kolkata or Australia/Lord_Howe are rejected at startup.
timezone: Europe/Berlin

grid:
  maximum_import_kw: 10
  maximum_export_kw: 10

solver:
  name: highs
  time_limit_seconds: 60

# Persist validated normalized data returned by configured providers. Mount
# /app/data as a durable volume in container deployments.
persistence:
  directory: /app/data/provider-data

# Optional scheduled provider retrieval. The source name must match a registered
# provider, and each source has its own polling interval. Household-load history
# bootstraps with up to the ten-year maximum and uses available retained history
# when Home Assistant has less than that. History requests longer than seven days
# are made sequentially in contiguous chunks; a failed chunk leaves the last valid
# persisted data unchanged for the next scheduled retry. Grid-flow history is
# retained and refreshed the same way, and the electricity_prices source also
# retains its elapsed hours as historic prices. Historic battery state of charge
# is available when home_assistant.battery.efficiency_calculation is configured.
orchestration:
  enabled: false
  startup_fetch: true
  sources:
    household_load:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    grid_flow:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    battery:
      enabled: true
      interval_seconds: 300
    appliance.heat_pump:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    pv_generation_history:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    battery_efficiency:
      enabled: true
      interval_seconds: 86400
    pv_generation:
      enabled: true
      interval_seconds: 3600
    electricity_prices:
      enabled: true
      interval_seconds: 3600
    # Optional: extends the plan with EPEX Predictor forecasts after the
    # published prices; never required for planning.
    electricity_price_forecast:
      enabled: true
      interval_seconds: 3600
  optimization:
    # Plans every future hour covered by prices and the PV forecast once all
    # required sources hold current data. Add battery and ev to plan them.
    enabled: false
    required_sources:
      - household_load
      - pv_generation
      - electricity_prices
    # Longest plan in hours; it also ends where prices or the PV forecast end.
    horizon_hours: 168

# Optional direct PV forecast provider. The public Forecast.Solar tier requires
# no account or API key and provides hourly forecasts for today and tomorrow.
# Forecast.Solar uses azimuth 0 for south, -90 for east, and 90 for west.
forecast_solar:
  latitude: 52.52
  longitude: 13.41
  declination_degrees: 35
  azimuth_degrees: 0
  peak_power_kw: 8
  timeout_seconds: 10
  max_data_age_seconds: 7200

# Alternative to forecast_solar for an array spread over several roof faces;
# configure only one of the two. Open-Meteo needs no account or API key and is
# asked once per plane for plane-of-array irradiance. Azimuth: 0 south,
# -90 east, 90 west, 180 north. performance_factor scales nameplate power to
# measured AC output (calibrate it from measured production, see README).
# open_meteo_pv:
#   latitude: 52.52
#   longitude: 13.41
#   performance_factor: 0.8
#   planes:
#     - {name: West roof, tilt_degrees: 22, azimuth_degrees: 90, peak_power_kw: 6}
#     - {name: East roof, tilt_degrees: 22, azimuth_degrees: -90, peak_power_kw: 4}
#     - {name: South facade, tilt_degrees: 80, azimuth_degrees: 0, peak_power_kw: 1.2}
#   forecast_days: 2
#   timeout_seconds: 10
#   max_data_age_seconds: 7200

# Optional German EPEX Spot market prices from aWATTar. No API key is required.
# Values are wholesale EUR/MWh converted to the normalized EUR/kWh contract. Each
# request asks for the current hour up to 48 hours ahead, which reaches the next
# day's prices once aWATTar publishes them at 14:00 local time.
awattar:
  base_url: https://api.awattar.de/v1/marketdata
  timeout_seconds: 10
  max_data_age_seconds: 7200

# Optional EPEX Predictor market-price forecast (public instance, no key) for
# the hours after the published day-ahead prices.
epex_predictor:
  base_url: https://epexpredictor.batzill.com
  region: DE
  forecast_hours: 168
  timeout_seconds: 10

# Optional Home Assistant provider settings. The token should be a long-lived
# access token and must not be committed to source control. Every energy
# aggregation (household_load, grid_import, grid_export, and each energy_in and
# energy_out of the calculated efficiency legs) has the same shape: a list of
# terms, one per operation. The hourly value is the energy of the entities of
# the "add" term minus the energy of the entities of the "subtract" term. Energy
# entities must be cumulative energy readings; instantaneous W/kW sensors are
# rejected.
#
# "part" decides what a negative hourly sum means. With the default "net" it is
# invalid data and excludes the hour. With "positive" only the positive part of
# the sum is wanted, so a negative sum is a legitimate zero: the hour is
# imported as 0 and only counted in the log (clamped_hour_count).
#
# An entity ID may be used by several aggregations, for example in more than one
# calculated efficiency leg or in both household load and grid import, but only
# once within one aggregation. Each distinct entity ID is imported once per
# orchestration cycle and shared by every aggregation that uses it. Its
# settings, such as maximum_interval_energy_kwh, apply to each aggregation
# separately, so they may differ between aggregations.
home_assistant:
  base_url: http://homeassistant.local:8123
  token: replace-with-a-long-lived-access-token
  # Any measured energy source uses the same aggregation and history pipeline.
  # Measured PV actuals; distinct from the Forecast.Solar pv_generation source.
  pv_generation:
    terms:
      - operation: add
        entities:
          - entity_id: sensor.pv_energy
            state_class: total_increasing
            unit: kWh
            maximum_interval_energy_kwh: 8
  household_load:
    terms:
      - operation: add
        entities:
          - entity_id: sensor.household_energy
            state_class: total_increasing
            unit: kWh
            # The most energy this entity may report in one hour and in one
            # counter step (default: 100 kWh). A larger value excludes the hour
            # instead of importing it.
            maximum_interval_energy_kwh: 15
      - operation: subtract
        entities:
          - entity_id: sensor.ev_energy
            state_class: total
            unit: kWh
            maximum_interval_energy_kwh: 11
  grid_import:
    terms:
      - operation: add
        entities:
          - entity_id: sensor.grid_import_energy
            state_class: total_increasing
            unit: kWh
  grid_export:
    terms:
      - operation: add
        entities:
          - entity_id: sensor.grid_export_energy
            state_class: total_increasing
            unit: kWh
  # Long history ranges use contiguous requests of no more than seven days. The
  # orchestration lookback is applied only to the first request.
  # Battery imports read the live state of the mapped Home Assistant entity.
  # Static battery values may instead be constants using {value, unit}; numeric
  # shorthand uses the canonical unit for the field. The importer returns one
  # current hourly value and persists the latest valid snapshot.
  battery:
    state_of_charge:
      entity_id: sensor.battery_state_of_charge
      unit: '%'
    capacity:
      value: 28.7
      unit: kWh
    minimum_soc:
      value: 5
      unit: '%'
    maximum_soc:
      value: 100
      unit: '%'
    maximum_charge:
      value: 12
      unit: kW
    maximum_discharge:
      value: 12
      unit: kW
    battery_efficiency:
      value: 0.85
      unit: ratio
    # Wear cost of each kWh the battery delivers, in EUR.
    throughput_cost_eur_per_kwh: 0
    # restore_initial ends every plan at least as full as it began;
    # value_stored_energy credits the remaining energy instead, by default
    # at the cheapest import price of the plan.
    end_of_horizon: restore_initial
    # end_of_horizon_value_eur_per_kwh: 0.25
    # Optional calculated efficiency. A configured battery_efficiency takes
    # precedence and emits a warning. Inverter values are not battery fields.
    # efficiency_calculation:
    #   state_of_charge:
    #     entity_id: sensor.battery_state_of_charge
    #     unit: '%'
    #   history_start: 2020-01-01T00:00:00+00:00
    #   full_soc_threshold_percent: 100
    #   minimum_battery_throughput_kwh: 10
    #   minimum_inverter_charge_throughput_kwh: 10
    #   minimum_inverter_discharge_throughput_kwh: 10
    #   battery:
    #     energy_in:
    #       terms:
    #         - operation: add
    #           entities:
    #             - {entity_id: sensor.battery_energy_in, state_class: total_increasing, unit: kWh}
    #     energy_out:
    #       terms:
    #         - operation: add
    #           entities:
    #             - {entity_id: sensor.battery_energy_out, state_class: total_increasing, unit: kWh}
    #   # DC-coupled system: PV reaches the battery directly, so the energy the
    #   # inverter charged from AC is the battery's charging energy minus the PV
    #   # yield. In a PV-surplus hour that difference is negative and means no AC
    #   # charging, so only its positive part is wanted.
    #   inverter_charge:
    #     energy_in:
    #       terms:
    #         - operation: add
    #           entities:
    #             - {entity_id: sensor.ac_into_inverter, state_class: total_increasing, unit: kWh}
    #     energy_out:
    #       part: positive
    #       terms:
    #         - operation: add
    #           entities:
    #             - {entity_id: sensor.battery_energy_in, state_class: total_increasing, unit: kWh}
    #         - operation: subtract
    #           entities:
    #             - {entity_id: sensor.mppt_energy, state_class: total_increasing, unit: kWh}
    #   # The inverter draws the battery discharge and the PV yield from the DC
    #   # bus; energy the battery took in during the same hour never reached it.
    #   inverter_discharge:
    #     energy_in:
    #       part: positive
    #       terms:
    #         - operation: add
    #           entities:
    #             - {entity_id: sensor.battery_energy_out, state_class: total_increasing, unit: kWh}
    #             - {entity_id: sensor.mppt_energy, state_class: total_increasing, unit: kWh}
    #         - operation: subtract
    #           entities:
    #             - {entity_id: sensor.battery_energy_in, state_class: total_increasing, unit: kWh}
    #     energy_out:
    #       terms:
    #         - operation: add
    #           entities:
    #             - {entity_id: sensor.inverter_to_ac, state_class: total_increasing, unit: kWh}
  # Optional electric vehicle; add ev to the orchestration sources to plan it.
  # ev:
  #   state_of_charge: {entity_id: sensor.ev_battery_level, unit: '%'}
  #   plugged_in: {entity_id: binary_sensor.ev_charging_cable, plugged_in_states: ['on']}
  #   capacity_kwh: 60
  #   minimum_charge_kw: 1.4
  #   maximum_charge_kw: 11
  #   charge_efficiency: 0.9
  timeout_seconds: 10
  # Optional polling health threshold; it does not limit historical retention.
  max_data_age_seconds: 7200

# Optional consumer tariff on top of the market price; the export price stays
# the market price. Without it, both directions use the market price.
tariff:
  grid_fee_bands:
    - {start_hour: 0, end_hour: 7, fee_ct_per_kwh: 0.95}
    - {start_hour: 7, end_hour: 15, fee_ct_per_kwh: 9.53}
    - {start_hour: 15, end_hour: 20, fee_ct_per_kwh: 15.65}
    - {start_hour: 20, end_hour: 24, fee_ct_per_kwh: 9.53}
  supplier_surcharge_ct_per_kwh: 1.0
  levies_ct_per_kwh: 2.946
  concession_fee_ct_per_kwh: 1.32
  electricity_tax_ct_per_kwh: 2.05
  vat_rate: 0.19

# auto backtests every method and plans with the smallest mean absolute error.
load_forecast:
  method: auto
  backtest_days: 7

# Optional EV charging wish, used when home_assistant.ev is configured.
# ev_charging:
#   strategy: deadline   # deadline, immediate, surplus or minimum_plus_target
#   minimum_soc_percent: 80
#   deadline: '07:00'
#   weekly:
#     monday: {minimum_soc_percent: 80, deadline: '06:30'}
