# Copy this file to config.yaml and adjust values for the deployment.
time_resolution_minutes: 60

grid:
  maximum_import_kw: 10
  maximum_export_kw: 10

solver:
  name: highs
  time_limit_seconds: 60

# Persist validated normalized data returned by configured providers. Mount
# /app/data as a durable volume in container deployments.
persistence:
  directory: /app/data/provider-data

# Optional scheduled provider retrieval. The source name must match a registered
# provider, and each source has its own polling interval. Household-load history
# bootstraps with up to the ten-year maximum and uses available retained history
# when Home Assistant has less than that.
orchestration:
  enabled: false
  startup_fetch: true
  sources:
    household_load:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    grid_flow:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    battery:
      enabled: true
      interval_seconds: 300
    pv_generation:
      enabled: true
      interval_seconds: 3600
  optimization:
    # Enable after an optimization plan generator is available.
    enabled: false
    required_sources:
      - household_load

# Optional direct PV forecast provider. The public Forecast.Solar tier requires
# no account or API key and provides hourly forecasts for today and tomorrow.
# Forecast.Solar uses azimuth 0 for south, -90 for east, and 90 for west.
forecast_solar:
  latitude: 52.52
  longitude: 13.41
  declination_degrees: 35
  azimuth_degrees: 0
  peak_power_kw: 8
  timeout_seconds: 10
  max_data_age_seconds: 7200

# Optional Home Assistant provider settings. The token should be a long-lived
# access token and must not be committed to source control. Household-load
# entities must be energy readings; instantaneous W/kW sensors are rejected.
home_assistant:
  base_url: http://homeassistant.local:8123
  token: replace-with-a-long-lived-access-token
  household_load_entities:
    - entity_id: sensor.household_energy
      state_class: total_increasing
      unit: kWh
      operation: add
      # Optional physical upper bound for one hourly cumulative-energy delta.
      maximum_interval_energy_kwh: 15
    - entity_id: sensor.ev_energy
      state_class: total
      unit: kWh
      operation: subtract
      maximum_interval_energy_kwh: 11
  grid_import_entities:
    - entity_id: sensor.grid_import_energy
      state_class: total_increasing
      unit: kWh
      operation: add
  grid_export_entities:
    - entity_id: sensor.grid_export_energy
      state_class: total_increasing
      unit: kWh
      operation: add
  # Battery imports read the current state of each mapped Home Assistant entity.
  # Values may be in the entity state or in a named attribute. The importer
  # returns one current hourly value and persists the latest valid snapshot.
  battery:
    state_of_charge:
      entity_id: sensor.battery_state_of_charge
      unit: '%'
    capacity:
      entity_id: sensor.battery
      attribute: capacity_kwh
      unit: kWh
    minimum_soc:
      entity_id: sensor.battery
      attribute: minimum_soc_kwh
      unit: kWh
    maximum_soc:
      entity_id: sensor.battery
      attribute: maximum_soc_kwh
      unit: kWh
    maximum_charge:
      entity_id: sensor.battery
      attribute: maximum_charge_kw
      unit: kW
    maximum_discharge:
      entity_id: sensor.battery
      attribute: maximum_discharge_kw
      unit: kW
    charge_efficiency:
      entity_id: sensor.battery
      attribute: charge_efficiency
      unit: ratio
    discharge_efficiency:
      entity_id: sensor.battery
      attribute: discharge_efficiency
      unit: ratio
  timeout_seconds: 10
  # Optional polling health threshold; it does not limit historical retention.
  max_data_age_seconds: 7200
