# Copy this file to config.yaml and adjust values for the deployment.
time_resolution_minutes: 60

grid:
  maximum_import_kw: 10
  maximum_export_kw: 10

solver:
  name: highs
  time_limit_seconds: 60

# Persist validated normalized data returned by configured providers. Mount
# /app/data as a durable volume in container deployments.
persistence:
  directory: /app/data/provider-data

# Optional scheduled provider retrieval. The source name must match a registered
# provider, and each source has its own polling interval. Household-load history
# bootstraps with up to the ten-year maximum and uses available retained history
# when Home Assistant has less than that. History requests longer than seven days
# are made sequentially in contiguous chunks; a failed chunk leaves the last valid
# persisted data unchanged for the next scheduled retry.
orchestration:
  enabled: false
  startup_fetch: true
  sources:
    household_load:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    grid_flow:
      enabled: true
      interval_seconds: 3600
      history_lookback_seconds: 3600
    battery:
      enabled: true
      interval_seconds: 300
    battery_efficiency:
      enabled: true
      interval_seconds: 86400
    pv_generation:
      enabled: true
      interval_seconds: 3600
    electricity_prices:
      enabled: true
      interval_seconds: 3600
  optimization:
    # Enable after an optimization plan generator is available.
    enabled: false
    required_sources:
      - household_load

# Optional direct PV forecast provider. The public Forecast.Solar tier requires
# no account or API key and provides hourly forecasts for today and tomorrow.
# Forecast.Solar uses azimuth 0 for south, -90 for east, and 90 for west.
forecast_solar:
  latitude: 52.52
  longitude: 13.41
  declination_degrees: 35
  azimuth_degrees: 0
  peak_power_kw: 8
  timeout_seconds: 10
  max_data_age_seconds: 7200

# Optional German EPEX Spot market prices from aWATTar. No API key is required.
# Values are wholesale EUR/MWh converted to the normalized EUR/kWh contract.
awattar:
  base_url: https://api.awattar.de/v1/marketdata
  timeout_seconds: 10
  max_data_age_seconds: 7200

# Optional Home Assistant provider settings. The token should be a long-lived
# access token and must not be committed to source control. Household-load
# entities must be energy readings; instantaneous W/kW sensors are rejected.
home_assistant:
  base_url: http://homeassistant.local:8123
  token: replace-with-a-long-lived-access-token
  household_load_entities:
    - entity_id: sensor.household_energy
      state_class: total_increasing
      unit: kWh
      operation: add
      # Physical upper bound for one hourly cumulative-energy delta (default: 100 kWh).
      maximum_interval_energy_kwh: 15
    - entity_id: sensor.ev_energy
      state_class: total
      unit: kWh
      operation: subtract
      maximum_interval_energy_kwh: 11
  grid_import_entities:
    - entity_id: sensor.grid_import_energy
      state_class: total_increasing
      unit: kWh
      operation: add
  grid_export_entities:
    - entity_id: sensor.grid_export_energy
      state_class: total_increasing
      unit: kWh
      operation: add
  # Entity IDs may be reused across household-load and grid-flow categories,
  # but must not be repeated within one category.
  # Long history ranges use contiguous requests of no more than seven days. The
  # orchestration lookback is applied only to the first request.
  # Battery imports read the live state of the mapped Home Assistant entity.
  # Static battery values may instead be constants using {value, unit}; numeric
  # shorthand uses the canonical unit for the field. The importer returns one
  # current hourly value and persists the latest valid snapshot.
  battery:
    state_of_charge:
      entity_id: sensor.battery_state_of_charge
      unit: '%'
    capacity:
      value: 28.7
      unit: kWh
    minimum_soc:
      value: 5
      unit: '%'
    maximum_soc:
      value: 100
      unit: '%'
    maximum_charge:
      value: 12
      unit: kW
    maximum_discharge:
      value: 12
      unit: kW
    battery_efficiency:
      value: 0.85
      unit: ratio
    # Optional calculated efficiency. A configured battery_efficiency takes
    # precedence and emits a warning. Inverter values are not battery fields.
    # efficiency_calculation:
    #   state_of_charge:
    #     entity_id: sensor.battery_state_of_charge
    #     unit: '%'
    #   history_start: 2020-01-01T00:00:00+00:00
    #   full_soc_threshold_percent: 100
    #   minimum_battery_throughput_kwh: 10
    #   minimum_inverter_charge_throughput_kwh: 10
    #   minimum_inverter_discharge_throughput_kwh: 10
    #   battery:
    #     energy_in:
    #       - {entity_id: sensor.battery_energy_in, state_class: total_increasing, unit: kWh, operation: add}
    #     energy_out:
    #       - {entity_id: sensor.battery_energy_out, state_class: total_increasing, unit: kWh, operation: add}
    #   inverter_charge:
    #     energy_in:
    #       - {entity_id: sensor.ac_into_inverter, state_class: total_increasing, unit: kWh, operation: add}
    #     energy_out:
    #       - {entity_id: sensor.battery_energy_in, state_class: total_increasing, unit: kWh, operation: add}
    #       - {entity_id: sensor.mppt_energy, state_class: total_increasing, unit: kWh, operation: subtract}
    #   inverter_discharge:
    #     energy_in:
    #       - {entity_id: sensor.battery_energy_out, state_class: total_increasing, unit: kWh, operation: add}
    #       - {entity_id: sensor.mppt_energy, state_class: total_increasing, unit: kWh, operation: subtract}
    #     energy_out:
    #       - {entity_id: sensor.inverter_to_ac, state_class: total_increasing, unit: kWh, operation: add}
  timeout_seconds: 10
  # Optional polling health threshold; it does not limit historical retention.
  max_data_age_seconds: 7200
