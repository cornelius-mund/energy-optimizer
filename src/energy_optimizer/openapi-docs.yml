openapi: 3.1.0
info:
  title: Energy Optimizer
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Return the service health and running version.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /optimize:
    post:
      summary: Optimize
      description: Validate an hourly optimization request at the versioned API boundary.
      operationId: optimize_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HourlyOptimizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/battery:
    post:
      summary: Battery
      description: Validate a versioned hourly battery state and capabilities object.
      operationId: battery_api_v1_battery_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatteryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BatteryRequest:
      properties:
        schema_version:
          type: string
          const: '1'
          title: Schema Version
          description: Version of this API contract
        start_time:
          type: string
          format: date-time
          title: Start Time
          description: Timezone-aware start of the series
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
          description: Duration of every series interval; hourly data requires 60
        state_of_charge_kwh:
          items:
            type: number
            maximum: 100000.0
            minimum: 0.0
          type: array
          maxItems: 168
          minItems: 1
          title: State Of Charge Kwh
          description: Battery state of charge in kWh, one value per interval
        capacity_kwh:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Capacity Kwh
          description: Usable battery capacity in kWh
        minimum_soc_kwh:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Minimum Soc Kwh
          description: Minimum allowed state of charge in kWh
        maximum_soc_kwh:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Maximum Soc Kwh
          description: Maximum allowed state of charge in kWh
        initial_soc_kwh:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Initial Soc Kwh
          description: State of charge before the first interval in kWh
        maximum_charge_kw:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Maximum Charge Kw
          description: Maximum charging power in kW
        maximum_discharge_kw:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Maximum Discharge Kw
          description: Maximum discharging power in kW
        charge_efficiency:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Charge Efficiency
          description: Fraction of charging energy retained by the battery
        discharge_efficiency:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Discharge Efficiency
          description: Fraction of battery energy delivered during discharge
        unit:
          type: string
          const: kWh
          title: Unit
          description: Unit used by energy fields
        power_unit:
          type: string
          const: kW
          title: Power Unit
          description: Unit used by power fields
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceMetadata'
          - type: 'null'
          description: Optional source metadata for externally supplied data
      additionalProperties: false
      type: object
      required:
      - schema_version
      - start_time
      - interval_minutes
      - state_of_charge_kwh
      - capacity_kwh
      - minimum_soc_kwh
      - maximum_soc_kwh
      - initial_soc_kwh
      - maximum_charge_kw
      - maximum_discharge_kw
      - charge_efficiency
      - discharge_efficiency
      - unit
      - power_unit
      title: BatteryRequest
      description: Versioned battery state and capability data at the API boundary.
    BatteryResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
        schema_version:
          type: string
          const: '1'
          title: Schema Version
        start_time:
          type: string
          format: date-time
          title: Start Time
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        state_of_charge_kwh:
          items:
            type: number
          type: array
          title: State Of Charge Kwh
        capacity_kwh:
          type: number
          title: Capacity Kwh
        minimum_soc_kwh:
          type: number
          title: Minimum Soc Kwh
        maximum_soc_kwh:
          type: number
          title: Maximum Soc Kwh
        initial_soc_kwh:
          type: number
          title: Initial Soc Kwh
        maximum_charge_kw:
          type: number
          title: Maximum Charge Kw
        maximum_discharge_kw:
          type: number
          title: Maximum Discharge Kw
        charge_efficiency:
          type: number
          title: Charge Efficiency
        discharge_efficiency:
          type: number
          title: Discharge Efficiency
        unit:
          type: string
          const: kWh
          title: Unit
        power_unit:
          type: string
          const: kW
          title: Power Unit
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceMetadata'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - status
      - schema_version
      - start_time
      - interval_minutes
      - state_of_charge_kwh
      - capacity_kwh
      - minimum_soc_kwh
      - maximum_soc_kwh
      - initial_soc_kwh
      - maximum_charge_kw
      - maximum_discharge_kw
      - charge_efficiency
      - discharge_efficiency
      - unit
      - power_unit
      title: BatteryResponse
      description: Response returned after battery data passes validation.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HourlyOptimizationRequest:
      properties:
        start_time:
          type: string
          format: date-time
          title: Start Time
          description: Timezone-aware start of the horizon
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
          description: Duration of every interval; hourly requests require 60
        load_kw:
          items:
            type: number
            minimum: 0.0
            description: Household load in kW
          type: array
          maxItems: 168
          minItems: 1
          title: Load Kw
        pv_generation_kw:
          items:
            type: number
            minimum: 0.0
            description: PV generation in kW
          type: array
          maxItems: 168
          minItems: 1
          title: Pv Generation Kw
        import_price_eur_per_kwh:
          items:
            type: number
            description: Grid import price in EUR/kWh
          type: array
          maxItems: 168
          minItems: 1
          title: Import Price Eur Per Kwh
        export_price_eur_per_kwh:
          items:
            type: number
            description: Grid export price in EUR/kWh
          type: array
          maxItems: 168
          minItems: 1
          title: Export Price Eur Per Kwh
      additionalProperties: false
      type: object
      required:
      - start_time
      - interval_minutes
      - load_kw
      - pv_generation_kw
      - import_price_eur_per_kwh
      - export_price_eur_per_kwh
      title: HourlyOptimizationRequest
      description: Validated hourly inputs accepted by the optimization boundary.
    OptimizationResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
        start_time:
          type: string
          format: date-time
          title: Start Time
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        hours:
          type: integer
          maximum: 168.0
          minimum: 1.0
          title: Hours
      additionalProperties: false
      type: object
      required:
      - status
      - start_time
      - interval_minutes
      - hours
      title: OptimizationResponse
      description: Response returned after an hourly request passes API validation.
    SourceMetadata:
      properties:
        provider:
          type: string
          maxLength: 100
          minLength: 1
          title: Provider
        entity_id:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Entity Id
      additionalProperties: false
      type: object
      required:
      - provider
      title: SourceMetadata
      description: Identify the system that supplied a normalized data series.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
