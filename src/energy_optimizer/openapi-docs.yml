openapi: 3.1.0
info:
  title: Energy Optimizer
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Return the service health and running version.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /optimize:
    post:
      summary: Optimize
      description: Validate an hourly optimization request at the versioned API boundary.
      operationId: optimize_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HourlyOptimizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/battery:
    post:
      summary: Battery
      description: Validate a versioned hourly battery state and capabilities object.
      operationId: battery_api_v1_battery_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatteryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/electricity-prices:
    post:
      summary: Electricity Prices
      description: Validate normalized hourly electricity-price data.
      operationId: electricity_prices_api_v1_electricity_prices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectricityPriceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectricityPriceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/household-load:
    get:
      summary: Persisted Household Load
      description: Return the latest persisted normalized household-load provider
        data.
      operationId: persisted_household_load_api_v1_household_load_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdLoadResponse'
        '404':
          description: No persisted provider data is available
        '503':
          description: Provider data persistence is unavailable
    post:
      summary: Household Load
      description: Validate a versioned hourly household-load data series.
      operationId: household_load_api_v1_household_load_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdLoadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdLoadResponse'
        '503':
          description: Provider data could not be persisted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/historic/household-load:
    get:
      summary: Historic Household Load
      description: Return persisted household-load actuals for a requested time range.
      operationId: historic_household_load_api_v1_historic_household_load_get
      parameters:
      - name: start_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inclusive timezone-aware range start
          title: Start Time
        description: Inclusive timezone-aware range start
      - name: end_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Exclusive timezone-aware range end
          title: End Time
        description: Exclusive timezone-aware range end
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricHouseholdLoadResponse'
        '404':
          description: No persisted household-load data is available
        '503':
          description: Persisted household-load data is unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard/data:
    get:
      summary: Dashboard Data
      description: 'Return the versioned dashboard contract without mixing scenarios.


        The actual scenario returns the hourly historic series of every available

        asset, aligned to the requested half-open UTC range with null gaps, and

        lists in `assets` why any asset contributed no series. Absent, stale, or

        corrupt assets never invalidate the series of other assets.'
      operationId: dashboard_data_api_v1_dashboard_data_get
      parameters:
      - name: start_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inclusive timezone-aware range start
          title: Start Time
        description: Inclusive timezone-aware range start
      - name: end_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Exclusive timezone-aware range end
          title: End Time
        description: Exclusive timezone-aware range end
      - name: scenario_kind
        in: query
        required: false
        schema:
          enum:
          - actual
          - forecast
          - plan
          - efficiency
          type: string
          default: actual
          title: Scenario Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDataResponse'
        '503':
          description: Dashboard data persistence is unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard/excluded-hours:
    get:
      summary: Excluded Hours
      description: 'List every hour excluded from imported history in a UTC range.


        An hour of Home Assistant history is imported only if every data point that

        contributes to it is valid. Every other hour has no value and is listed here

        with each cause: the entity, a reason code, a message, and the exact data

        points. A source that is not configured, has no persisted history yet, or
        is

        corrupt is reported in `sources` and never hides the other sources.'
      operationId: excluded_hours_api_v1_dashboard_excluded_hours_get
      parameters:
      - name: start_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inclusive timezone-aware range start
          title: Start Time
        description: Inclusive timezone-aware range start
      - name: end_time
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Exclusive timezone-aware range end
          title: End Time
        description: Exclusive timezone-aware range end
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcludedHoursResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pv-generation:
    post:
      summary: Pv Generation
      description: Validate a versioned hourly PV-generation data series.
      operationId: pv_generation_api_v1_pv_generation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvGenerationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvGenerationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/grid-flow:
    get:
      summary: Persisted Grid Flow
      description: Return the latest persisted normalized grid-flow provider data.
      operationId: persisted_grid_flow_api_v1_grid_flow_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridFlowResponse'
        '404':
          description: No persisted provider data is available
        '503':
          description: Provider data persistence is unavailable
    post:
      summary: Grid Flow
      description: Validate a versioned hourly grid import and export data series.
      operationId: grid_flow_api_v1_grid_flow_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridFlowRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridFlowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BatteryRequest:
      properties:
        schema_version:
          type: string
          const: '1'
          title: Schema Version
          description: Version of this API contract
        start_time:
          type: string
          format: date-time
          title: Start Time
          description: Timezone-aware start of the series
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
          description: Duration of every series interval; hourly data requires 60
        state_of_charge_kwh:
          items:
            type: number
            maximum: 100000.0
            minimum: 0.0
          type: array
          maxItems: 87672
          minItems: 1
          title: State Of Charge Kwh
          description: Battery state of charge in kWh, one value per interval
        capacity_kwh:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Capacity Kwh
          description: Usable battery capacity in kWh
        minimum_soc_kwh:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Minimum Soc Kwh
          description: Minimum allowed state of charge in kWh
        maximum_soc_kwh:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Maximum Soc Kwh
          description: Maximum allowed state of charge in kWh
        initial_soc_kwh:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Initial Soc Kwh
          description: State of charge before the first interval in kWh
        maximum_charge_kw:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Maximum Charge Kw
          description: Maximum charging power in kW
        maximum_discharge_kw:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Maximum Discharge Kw
          description: Maximum discharging power in kW
        battery_efficiency:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Battery Efficiency
          description: Measured battery round-trip efficiency
        unit:
          type: string
          const: kWh
          title: Unit
          description: Unit used by energy fields
        power_unit:
          type: string
          const: kW
          title: Power Unit
          description: Unit used by power fields
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceMetadata'
          - type: 'null'
          description: Optional source metadata for externally supplied data
      additionalProperties: false
      type: object
      required:
      - schema_version
      - start_time
      - interval_minutes
      - state_of_charge_kwh
      - capacity_kwh
      - minimum_soc_kwh
      - maximum_soc_kwh
      - initial_soc_kwh
      - maximum_charge_kw
      - maximum_discharge_kw
      - battery_efficiency
      - unit
      - power_unit
      title: BatteryRequest
      description: Versioned battery state and capability data at the API boundary.
    BatteryResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
        schema_version:
          type: string
          const: '1'
          title: Schema Version
        start_time:
          type: string
          format: date-time
          title: Start Time
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        state_of_charge_kwh:
          items:
            type: number
          type: array
          title: State Of Charge Kwh
        capacity_kwh:
          type: number
          title: Capacity Kwh
        minimum_soc_kwh:
          type: number
          title: Minimum Soc Kwh
        maximum_soc_kwh:
          type: number
          title: Maximum Soc Kwh
        initial_soc_kwh:
          type: number
          title: Initial Soc Kwh
        maximum_charge_kw:
          type: number
          title: Maximum Charge Kw
        maximum_discharge_kw:
          type: number
          title: Maximum Discharge Kw
        battery_efficiency:
          type: number
          title: Battery Efficiency
        unit:
          type: string
          const: kWh
          title: Unit
        power_unit:
          type: string
          const: kW
          title: Power Unit
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceMetadata'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - status
      - schema_version
      - start_time
      - interval_minutes
      - state_of_charge_kwh
      - capacity_kwh
      - minimum_soc_kwh
      - maximum_soc_kwh
      - initial_soc_kwh
      - maximum_charge_kw
      - maximum_discharge_kw
      - battery_efficiency
      - unit
      - power_unit
      title: BatteryResponse
      description: Response returned after battery data passes validation.
    DashboardAssetAvailability:
      properties:
        asset:
          type: string
          minLength: 1
          title: Asset
          description: Stable asset key
        status:
          type: string
          enum:
          - available
          - empty
          - stale
          - not_configured
          - unavailable
          - invalid
          title: Status
          description: 'available: series returned; empty: history exists but has
            no observation in the range; stale: series returned but the newest observation
            exceeds the polling threshold; not_configured: the installation has no
            source for this asset; unavailable: configured but no usable persisted
            data; invalid: persisted data is corrupt or could not be recovered and
            is withheld'
        series_ids:
          items:
            type: string
          type: array
          title: Series Ids
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Actionable explanation when status is not available
      additionalProperties: false
      type: object
      required:
      - asset
      - status
      title: DashboardAssetAvailability
      description: Whether one asset contributed data to a dashboard response, and
        why not.
    DashboardDataResponse:
      properties:
        schema_version:
          type: string
          const: '1'
          title: Schema Version
        status:
          type: string
          enum:
          - validated
          - partial
          - stale
          - empty
          - unavailable
          - invalid
          - infeasible
          title: Status
        requested_start_time:
          type: string
          format: date-time
          title: Requested Start Time
        requested_end_time:
          type: string
          format: date-time
          title: Requested End Time
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        series:
          items:
            $ref: '#/components/schemas/DashboardSeries'
          type: array
          title: Series
        metrics:
          items:
            $ref: '#/components/schemas/DashboardMetric'
          type: array
          title: Metrics
        assets:
          items:
            $ref: '#/components/schemas/DashboardAssetAvailability'
          type: array
          title: Assets
          description: Per-asset availability; populated for the actual scenario
        diagnostics:
          items:
            type: string
          type: array
          title: Diagnostics
        plan_summary:
          anyOf:
          - $ref: '#/components/schemas/DashboardPlanSummary'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - schema_version
      - status
      - requested_start_time
      - requested_end_time
      - interval_minutes
      - series
      title: DashboardDataResponse
      description: Versioned read contract for actual, forecast, and plan dashboard
        data.
    DashboardMetric:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        label:
          type: string
          minLength: 1
          title: Label
        value:
          type: number
          title: Value
        unit:
          type: string
          minLength: 1
          title: Unit
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - value
      - unit
      title: DashboardMetric
      description: One scalar dashboard measurement displayed separately from diagnostics.
    DashboardPlanSummary:
      properties:
        status:
          type: string
          enum:
          - available
          - empty
          - infeasible
          - unavailable
          title: Status
        objective_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Objective Value
        diagnostics:
          items:
            type: string
          type: array
          title: Diagnostics
      additionalProperties: false
      type: object
      required:
      - status
      title: DashboardPlanSummary
      description: Optional plan-level diagnostics shared by dashboard consumers.
    DashboardSeries:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        data_type:
          type: string
          minLength: 1
          title: Data Type
        scenario_kind:
          type: string
          enum:
          - actual
          - forecast
          - plan
          title: Scenario Kind
        timestamps:
          items:
            type: string
            format: date-time
          type: array
          title: Timestamps
        values:
          items:
            anyOf:
            - type: number
            - type: 'null'
          type: array
          title: Values
        unit:
          type: string
          minLength: 1
          title: Unit
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceMetadata'
          - type: 'null'
        requested_start_time:
          type: string
          format: date-time
          title: Requested Start Time
        requested_end_time:
          type: string
          format: date-time
          title: Requested End Time
        available_start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Available Start Time
        available_end_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Available End Time
        retrieved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Retrieved At
        generated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated At
        published_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Published At
        freshness:
          type: string
          enum:
          - fresh
          - stale
          - unknown
          title: Freshness
        validation_status:
          type: string
          enum:
          - valid
          - suspect
          - invalid
          title: Validation Status
        missing_intervals:
          items:
            type: string
            format: date-time
          type: array
          title: Missing Intervals
        is_default:
          type: boolean
          title: Is Default
          default: false
        calculation_status:
          anyOf:
          - type: string
            enum:
            - calculated
            - calculated_with_defaults
            - defaulted
            - unavailable
            - invalid
          - type: 'null'
          title: Calculation Status
      additionalProperties: false
      type: object
      required:
      - id
      - data_type
      - scenario_kind
      - timestamps
      - values
      - unit
      - requested_start_time
      - requested_end_time
      - available_start_time
      - available_end_time
      - retrieved_at
      - freshness
      - validation_status
      title: DashboardSeries
      description: One aligned, provider-independent dashboard series.
    ElectricityPriceRequest:
      properties:
        schema_version:
          type: string
          const: '1'
          title: Schema Version
          description: Version of this API contract
        timestamps:
          items:
            type: string
            format: date-time
          type: array
          maxItems: 87672
          minItems: 1
          title: Timestamps
          description: Timezone-aware hourly timestamps in ascending order
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
          description: Duration of every price interval; hourly data requires 60
        import_price_eur_per_kwh:
          items:
            type: number
            maximum: 100.0
            minimum: -100.0
          type: array
          maxItems: 87672
          minItems: 1
          title: Import Price Eur Per Kwh
          description: Grid import price in EUR/kWh, one value per timestamp
        export_price_eur_per_kwh:
          items:
            type: number
            maximum: 100.0
            minimum: -100.0
          type: array
          maxItems: 87672
          minItems: 1
          title: Export Price Eur Per Kwh
          description: Grid export price in EUR/kWh, one value per timestamp
        unit:
          type: string
          const: EUR/kWh
          title: Unit
          description: Unit used by price fields
        source:
          $ref: '#/components/schemas/SourceMetadata'
          description: Provider-independent source metadata
        retrieved_at:
          type: string
          format: date-time
          title: Retrieved At
          description: Time when the source data was retrieved
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: Time after which the data is stale
      additionalProperties: false
      type: object
      required:
      - schema_version
      - timestamps
      - interval_minutes
      - import_price_eur_per_kwh
      - export_price_eur_per_kwh
      - unit
      - source
      - retrieved_at
      - expires_at
      title: ElectricityPriceRequest
      description: Versioned normalized hourly electricity-price data.
    ElectricityPriceResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
        schema_version:
          type: string
          const: '1'
          title: Schema Version
        timestamps:
          items:
            type: string
            format: date-time
          type: array
          title: Timestamps
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        import_price_eur_per_kwh:
          items:
            type: number
          type: array
          title: Import Price Eur Per Kwh
        export_price_eur_per_kwh:
          items:
            type: number
          type: array
          title: Export Price Eur Per Kwh
        unit:
          type: string
          const: EUR/kWh
          title: Unit
        source:
          $ref: '#/components/schemas/SourceMetadata'
        retrieved_at:
          type: string
          format: date-time
          title: Retrieved At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - status
      - schema_version
      - timestamps
      - interval_minutes
      - import_price_eur_per_kwh
      - export_price_eur_per_kwh
      - unit
      - source
      - retrieved_at
      - expires_at
      title: ElectricityPriceResponse
      description: Response returned after electricity-price data passes validation.
    ExcludedDataPoint:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: When Home Assistant recorded the data point, or the hour start
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: The raw state exactly as Home Assistant reported it
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
          description: Set when the data point belongs to another entity than its
            cause
        previous_timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Previous Timestamp
          description: For a counter step, when the previous observation was recorded
        previous_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Previous Value
          description: For a counter step, the previous counter value in the entity
            unit
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: For a counter step, the counter value in the entity unit
        step_kwh:
          anyOf:
          - type: number
          - type: 'null'
          title: Step Kwh
          description: Energy of the counter step or hour in kWh; signed for components
        maximum_kwh:
          anyOf:
          - type: number
          - type: 'null'
          title: Maximum Kwh
          description: The configured maximum energy that applies, in kWh
      additionalProperties: false
      type: object
      required:
      - timestamp
      - state
      - unit
      - entity_id
      - previous_timestamp
      - previous_value
      - value
      - step_kwh
      - maximum_kwh
      title: ExcludedDataPoint
      description: One observation that contributed to an exclusion.
    ExcludedHour:
      properties:
        hour_start:
          type: string
          format: date-time
          title: Hour Start
          description: UTC start of the excluded hour
        source:
          type: string
          enum:
          - household_load
          - grid_flow
          - battery_efficiency
          title: Source
        causes:
          items:
            $ref: '#/components/schemas/ExclusionCause'
          type: array
          minItems: 1
