openapi: 3.1.0
info:
  title: Energy Optimizer
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Return the service health and running version.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /optimize:
    post:
      summary: Optimize
      description: Validate an hourly optimization request at the versioned API boundary.
      operationId: optimize_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HourlyOptimizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/electricity-prices:
    post:
      summary: Electricity Prices
      description: Validate normalized hourly electricity-price data.
      operationId: electricity_prices_api_v1_electricity_prices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectricityPriceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectricityPriceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ElectricityPriceRequest:
      properties:
        schema_version:
          type: string
          const: '1'
          title: Schema Version
          description: Version of this API contract
        timestamps:
          items:
            type: string
            format: date-time
          type: array
          maxItems: 168
          minItems: 1
          title: Timestamps
          description: Timezone-aware hourly timestamps in ascending order
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
          description: Duration of every price interval; hourly data requires 60
        import_price_eur_per_kwh:
          items:
            type: number
            maximum: 100.0
            minimum: -100.0
          type: array
          maxItems: 168
          minItems: 1
          title: Import Price Eur Per Kwh
          description: Grid import price in EUR/kWh, one value per timestamp
        export_price_eur_per_kwh:
          items:
            type: number
            maximum: 100.0
            minimum: -100.0
          type: array
          maxItems: 168
          minItems: 1
          title: Export Price Eur Per Kwh
          description: Grid export price in EUR/kWh, one value per timestamp
        unit:
          type: string
          const: EUR/kWh
          title: Unit
          description: Unit used by price fields
        source:
          $ref: '#/components/schemas/SourceMetadata'
          description: Provider-independent source metadata
        retrieved_at:
          type: string
          format: date-time
          title: Retrieved At
          description: Time when the source data was retrieved
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: Time after which the data is stale
      additionalProperties: false
      type: object
      required:
      - schema_version
      - timestamps
      - interval_minutes
      - import_price_eur_per_kwh
      - export_price_eur_per_kwh
      - unit
      - source
      - retrieved_at
      - expires_at
      title: ElectricityPriceRequest
      description: Versioned normalized hourly electricity-price data.
    ElectricityPriceResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
        schema_version:
          type: string
          const: '1'
          title: Schema Version
        timestamps:
          items:
            type: string
            format: date-time
          type: array
          title: Timestamps
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        import_price_eur_per_kwh:
          items:
            type: number
          type: array
          title: Import Price Eur Per Kwh
        export_price_eur_per_kwh:
          items:
            type: number
          type: array
          title: Export Price Eur Per Kwh
        unit:
          type: string
          const: EUR/kWh
          title: Unit
        source:
          $ref: '#/components/schemas/SourceMetadata'
        retrieved_at:
          type: string
          format: date-time
          title: Retrieved At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - status
      - schema_version
      - timestamps
      - interval_minutes
      - import_price_eur_per_kwh
      - export_price_eur_per_kwh
      - unit
      - source
      - retrieved_at
      - expires_at
      title: ElectricityPriceResponse
      description: Response returned after electricity-price data passes validation.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HourlyOptimizationRequest:
      properties:
        start_time:
          type: string
          format: date-time
          title: Start Time
          description: Timezone-aware start of the horizon
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
          description: Duration of every interval; hourly requests require 60
        load_kw:
          items:
            type: number
            minimum: 0.0
            description: Household load in kW
          type: array
          maxItems: 168
          minItems: 1
          title: Load Kw
        pv_generation_kw:
          items:
            type: number
            minimum: 0.0
            description: PV generation in kW
          type: array
          maxItems: 168
          minItems: 1
          title: Pv Generation Kw
        import_price_eur_per_kwh:
          items:
            type: number
            description: Grid import price in EUR/kWh
          type: array
          maxItems: 168
          minItems: 1
          title: Import Price Eur Per Kwh
        export_price_eur_per_kwh:
          items:
            type: number
            description: Grid export price in EUR/kWh
          type: array
          maxItems: 168
          minItems: 1
          title: Export Price Eur Per Kwh
      additionalProperties: false
      type: object
      required:
      - start_time
      - interval_minutes
      - load_kw
      - pv_generation_kw
      - import_price_eur_per_kwh
      - export_price_eur_per_kwh
      title: HourlyOptimizationRequest
      description: Validated hourly inputs accepted by the optimization boundary.
    OptimizationResponse:
      properties:
        status:
          type: string
          const: validated
          title: Status
        start_time:
          type: string
          format: date-time
          title: Start Time
        interval_minutes:
          type: integer
          const: 60
          title: Interval Minutes
        hours:
          type: integer
          maximum: 168.0
          minimum: 1.0
          title: Hours
      additionalProperties: false
      type: object
      required:
      - status
      - start_time
      - interval_minutes
      - hours
      title: OptimizationResponse
      description: Response returned after an hourly request passes API validation.
    SourceMetadata:
      properties:
        provider:
          type: string
          maxLength: 100
          minLength: 1
          title: Provider
        entity_id:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Entity Id
      additionalProperties: false
      type: object
      required:
      - provider
      title: SourceMetadata
      description: Identify the system that supplied a normalized data series.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
